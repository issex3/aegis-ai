services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD:-aegis-dev-only}@postgres:5432/aegis
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-aegis-dev-only}@redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256

  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.commercial.tasks:celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD:-aegis-dev-only}@postgres:5432/aegis
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-aegis-dev-only}@redis:6379/0
    depends_on:
      - postgres
      - redis
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis-dev-only}
      POSTGRES_DB: aegis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-aegis-dev-only} --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
